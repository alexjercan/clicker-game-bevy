[package]
name = "clicker_particles"
version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
publish = false

[dependencies]
bevy.workspace = true
bevy_hanabi = { version = "0.19.0", default-features = false, features = ["3d"] }

# NOTE: Hanabi particles need compute shaders, which wasm has only under WebGPU, and Bevy's wasm-only `webgpu` feature overrides the default `webgl2` backend.
[target.'cfg(target_arch = "wasm32")'.dependencies]
bevy = { workspace = true, features = ["webgpu"] }
