<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8"/>
        <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
        <title>ClickerGame</title>
        <link data-trunk rel="rust" data-cargo-no-default-features data-wasm-opt="0" />
        <link data-trunk rel="copy-dir" href="assets"/>
        <link data-trunk rel="copy-dir" href="credits"/>
        <link data-trunk rel="copy-file" href="LICENSE"/>
        <link data-trunk rel="copy-file" href="build/windows/icon.ico"/>
        <link rel="icon" href="icon.ico">
        <link data-trunk rel="inline" href="build/web/styles.css"/>
    </head>
    <body>
        <link data-trunk rel="inline" href="build/web/sound.js"/>
        <div class="game-container">
            <div class="lds-dual-ring"></div>
            <canvas id="bevy">
                Javascript and support for canvas is required
            </canvas>
        </div>
        <!-- NOTE: this plain inline script runs during parsing, after the
             container exists and before trunk's deferred wasm module, so a
             browser without WebGPU gets a message instead of a dead canvas. -->
        <link data-trunk rel="inline" href="build/web/webgpu-check.js"/>
    </body>
</html>
