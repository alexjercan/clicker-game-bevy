[package]
name = "clicker"
version = "0.1.0"
authors = ["jercan_alex27@yahoo.com"]
edition = "2021"
license = "MIT"
homepage = "https://github.com/alexjercan/clicker-game-bevy"
description = "Clicker game where you try to collect as many resources."
categories = ["games"]

[lib]
name = "game"
path = "src/lib.rs"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true

[profile.dist]
inherits = "release"
opt-level = 3
lto = true
codegen-units = 1
strip = true

[features]
default = ["dev"]
debug = ["dep:debug"]
dev = ["bevy/dynamic_linking", "debug"]

[dependencies]
bevy.workspace = true
bevy_asset_loader = "0.27.0"
bevy_rand = { version = "0.15.2", default-features = false, features = ["wyrand"] }
rand_core = "0.10.1"
bevy_tweening = "0.16.0"
debug = { path = "crates/debug", optional = true }
hexx = "0.25.0"

[target.'cfg(target_arch = "wasm32")'.dependencies]
bevy_rand = { version = "0.15.2", features = ["wasm_js"] }

[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.dependencies]
bevy = "0.19.1"

[build-dependencies]
embed-resource = "3.0.6"
