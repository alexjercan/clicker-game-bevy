[package]
name = "clicker"
version = "0.1.0"
authors = ["jercan_alex27@yahoo.com"]
edition = "2021"
license = "MIT"
homepage = "https://github.com/alexjercan/clicker-game-bevy"
description = "Clicker game where you try to collect as many resources."
categories = ["games"]

[lib]
name = "game"
path = "src/lib.rs"

# Enable a small amount of optimization in debug mode
[profile.dev]
opt-level = 1

# Enable high optimizations for dependencies (incl. Bevy), but not for our code:
[profile.dev.package."*"]
opt-level = 3

# This is used by trunk as it doesn't support custom profiles: https://github.com/trunk-rs/trunk/issues/605
# xbuild also uses this profile for building android AABs because I couldn't find a configuration for it
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true

# Profile for distribution
[profile.dist]
inherits = "release"
opt-level = 3
lto = true
codegen-units = 1
strip = true

[features]
default = ["dev"]
debug = [
    "dep:bevy-inspector-egui",
    "dep:iyes_perf_ui",
]
dev = [
    "bevy/dynamic_linking", "debug"
]

[dependencies]
bevy = { version = "0.15.1" }
bevy_asset_loader = { version = "0.22.0" }
bevy-inspector-egui = { version = "0.28.1", optional = true }
iyes_perf_ui = { git = "https://github.com/IyesGames/iyes_perf_ui.git", branch = "main", optional = true }
bevy_tweening = "0.12.0"
rand = "0.9.0"
leafwing-input-manager = "0.16.0"
hexmap = { path = "crates/hexmap" }

[workspace]
members = [
    "crates/*",
]
resolver = "2"

[build-dependencies]
embed-resource = "1"
