name: deploy-github-page

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-web:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Resolve pinned Rust toolchain
        run: rustup show active-toolchain
      - name: Install Dependencies
        run: sudo apt-get update; sudo apt-get install pkg-config libx11-dev libasound2-dev libudev-dev
      - name: Install trunk
        uses: jetli/trunk-action@v0.4.0
        with:
          version: 'latest'
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-about
      - name: Generate dependency licenses
        run: scripts/gen-licenses.sh
      - name: Add wasm target
        run: |
          rustup target add wasm32-unknown-unknown
      - name: Build playable wasm release
        run: trunk build --release --locked
      - name: Inspect playable wasm release
        run: scripts/check-release-contents.sh web dist
      - name: optimize Wasm
        uses: NiklasEi/wasm-opt-action@v2
        with:
          file: dist/*.wasm
          options: -Os --enable-bulk-memory --enable-nontrapping-float-to-int
      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4.2.5
        with:
          branch: gh-pages
          folder: dist
