name: release-flow

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"
  workflow_dispatch:
    inputs:
      version:
        description: 'Version - in the form of v1.2.3'
        required: true
        type: string

env:
  GAME_EXECUTABLE_NAME: clicker
  GAME_OSX_APP_NAME: Clicker

permissions:
  contents: write

jobs:
  get-version:
    runs-on: ubuntu-latest
    steps:
      - name: Get tag
        id: tag
        run: echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
    outputs:
      version: ${{ inputs.version || steps.tag.outputs.tag }}

  licenses:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Resolve pinned Rust toolchain
        run: rustup show active-toolchain
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-about
      - name: Generate dependency licenses
        run: scripts/gen-licenses.sh
      - uses: actions/upload-artifact@v4
        with:
          name: third-party-licenses
          path: credits/THIRD-PARTY-LICENSES.md

  build-macOS:
    runs-on: macos-latest
    needs: [get-version, licenses]
    env:
      MACOSX_DEPLOYMENT_TARGET: 11.0
      VERSION: ${{needs.get-version.outputs.version}}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: third-party-licenses
          path: credits
      - name: Resolve pinned Rust toolchain
        run: rustup show active-toolchain
      - name: Install Apple Silicon target
        run: rustup target add aarch64-apple-darwin
      - name: Build release for Apple Silicon
        run: |
          SDKROOT=$(xcrun -sdk macosx --show-sdk-path) cargo build --locked --profile dist --no-default-features --target=aarch64-apple-darwin
      - name: Install Apple x86 target
        run: rustup target add x86_64-apple-darwin
      - name: Build release for x86 Apple
        run: |
          SDKROOT=$(xcrun -sdk macosx --show-sdk-path) cargo build --locked --profile dist --no-default-features --target=x86_64-apple-darwin
      - name: Create Universal Binary
        run: |
          lipo -create -output target/dist/${{ env.GAME_EXECUTABLE_NAME }} target/aarch64-apple-darwin/dist/${{ env.GAME_EXECUTABLE_NAME }} target/x86_64-apple-darwin/dist/${{ env.GAME_EXECUTABLE_NAME }}
      - name: Create release
        run: |
          mkdir -p build/macos/src/Game.app/Contents/MacOS
          rm -rf build/macos/src/Game.app/Contents/MacOS/assets build/macos/src/Game.app/Contents/MacOS/credits
          cp -r assets build/macos/src/Game.app/Contents/MacOS/assets
          cp -r credits build/macos/src/Game.app/Contents/MacOS/credits
          cp LICENSE build/macos/src/Game.app/Contents/MacOS/LICENSE
          cp target/dist/${{ env.GAME_EXECUTABLE_NAME }} build/macos/src/Game.app/Contents/MacOS/
          scripts/check-release-contents.sh native build/macos/src/Game.app/Contents/MacOS ${{ env.GAME_EXECUTABLE_NAME }}
          mv build/macos/src/Game.app build/macos/src/${{ env.GAME_OSX_APP_NAME }}.app
          ln -s /Applications build/macos/src/
          hdiutil create -fs HFS+ -volname "${{ env.GAME_OSX_APP_NAME }}" -srcfolder build/macos/src ${{ env.GAME_EXECUTABLE_NAME }}.dmg
      - name: Upload release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: ${{ env.GAME_EXECUTABLE_NAME }}.dmg
          asset_name: ${{ env.GAME_EXECUTABLE_NAME }}_${{ env.VERSION }}_macOS.dmg
          release_name: ${{ env.VERSION }}
          tag: ${{ env.VERSION }}
          overwrite: true

  build-linux:
    runs-on: ubuntu-latest
    needs: [get-version, licenses]
    env:
      VERSION: ${{needs.get-version.outputs.version}}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Resolve pinned Rust toolchain
        run: rustup show active-toolchain
      - uses: actions/download-artifact@v4
        with:
          name: third-party-licenses
          path: credits
      - name: Install Dependencies
        run: sudo apt-get update; sudo apt-get install pkg-config libx11-dev libasound2-dev libudev-dev
      - name: Build release
        run: |
          cargo build --locked --profile dist --no-default-features
      - name: Prepare release
        run: |
          rm -rf target/package
          mkdir -p target/package
          cp target/dist/${{ env.GAME_EXECUTABLE_NAME }} target/package/
          cp -r assets credits target/package/
          cp LICENSE target/package/LICENSE
          chmod +x target/package/${{ env.GAME_EXECUTABLE_NAME }}
          scripts/check-release-contents.sh native target/package ${{ env.GAME_EXECUTABLE_NAME }}
      - name: Bundle release
        run: tar -C target/package -czf target/dist/${{ env.GAME_EXECUTABLE_NAME }}_linux.tar.gz .
      - name: Inspect native archive
        run: |
          rm -rf target/archive-check
          mkdir -p target/archive-check
          tar -xzf target/dist/${{ env.GAME_EXECUTABLE_NAME }}_linux.tar.gz -C target/archive-check
          scripts/check-release-contents.sh native target/archive-check ${{ env.GAME_EXECUTABLE_NAME }}
      - name: Upload release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: target/dist/${{ env.GAME_EXECUTABLE_NAME }}_linux.tar.gz
          asset_name: ${{ env.GAME_EXECUTABLE_NAME }}_${{ env.VERSION }}_linux.tar.gz
          release_name: ${{ env.VERSION }}
          tag: ${{ env.VERSION }}
          overwrite: true

  build-windows:
    runs-on: windows-latest
    needs: [get-version, licenses]
    env:
      VERSION: ${{needs.get-version.outputs.version}}
      BUILD_INSTALLER: ${{ false }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Resolve pinned Rust toolchain
        run: rustup show active-toolchain
      - uses: actions/download-artifact@v4
        with:
          name: third-party-licenses
          path: credits
      - name: Build release
        run: |
          cargo build --locked --profile dist --no-default-features
      - name: Prepare release
        shell: bash
        run: |
          rm -rf target/package
          mkdir -p target/package
          cp target/dist/${{ env.GAME_EXECUTABLE_NAME }}.exe target/package/
          cp -r assets credits target/package/
          cp LICENSE target/package/LICENSE
          scripts/check-release-contents.sh native target/package ${{ env.GAME_EXECUTABLE_NAME }}.exe
      - name: Zip release
        shell: pwsh
        run: Compress-Archive -Path target/package/* -DestinationPath ${{ env.GAME_EXECUTABLE_NAME }}_windows.zip
      - name: Inspect Windows archive
        shell: pwsh
        run: |
          Expand-Archive -Path ${{ env.GAME_EXECUTABLE_NAME }}_windows.zip -DestinationPath target/archive-check
          if (-not (Test-Path target/archive-check/${{ env.GAME_EXECUTABLE_NAME }}.exe)) { exit 1 }
          if (-not (Test-Path target/archive-check/assets)) { exit 1 }
          if (-not (Test-Path target/archive-check/credits/CREDITS.md)) { exit 1 }
          if (-not (Test-Path target/archive-check/credits/THIRD-PARTY-LICENSES.md)) { exit 1 }
          if (-not (Test-Path target/archive-check/LICENSE)) { exit 1 }
      - name: Upload release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: ${{ env.GAME_EXECUTABLE_NAME }}_windows.zip
          asset_name: ${{ env.GAME_EXECUTABLE_NAME }}_${{ env.VERSION }}_windows.zip
          tag: ${{ env.VERSION }}
          overwrite: true

  build-web:
    runs-on: ubuntu-latest
    needs: [get-version, licenses]
    env:
      VERSION: ${{needs.get-version.outputs.version}}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Resolve pinned Rust toolchain
        run: rustup show active-toolchain
      - name: Install Dependencies
        run: sudo apt-get update; sudo apt-get install pkg-config libx11-dev libasound2-dev libudev-dev
      - name: Install trunk
        uses: jetli/trunk-action@v0.4.0
        with:
          version: latest
      - uses: actions/download-artifact@v4
        with:
          name: third-party-licenses
          path: credits
      - name: Add wasm target
        run: |
          rustup target add wasm32-unknown-unknown
      - name: Build Release
        run: trunk build --release --locked
      - name: Inspect web release
        run: scripts/check-release-contents.sh web dist
      - name: Optimize Wasm
        uses: NiklasEi/wasm-opt-action@v2
        with:
          file: dist/*.wasm
          options: -Os --enable-bulk-memory --enable-nontrapping-float-to-int
      - name: Zip release
        run: cd dist && zip -r ../${{ env.GAME_EXECUTABLE_NAME }}_web.zip .
      - name: Inspect web archive
        run: |
          rm -rf target/web-archive-check
          mkdir -p target/web-archive-check
          unzip -q ${{ env.GAME_EXECUTABLE_NAME }}_web.zip -d target/web-archive-check
          scripts/check-release-contents.sh web target/web-archive-check
      - name: Upload release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: ${{ env.GAME_EXECUTABLE_NAME }}_web.zip
          asset_name: ${{ env.GAME_EXECUTABLE_NAME }}_${{ env.VERSION }}_web.zip
          release_name: ${{ env.VERSION }}
          tag: ${{ env.VERSION }}
          overwrite: true
